name: CI

# Runs on every push and pull request. Branch protection on GitHub requires
# both jobs ("Code quality" and "Tests") to pass before code can be merged
# into the protected branches.

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Code quality
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2
        with:
          php-version: '8.5'
          extensions: mbstring, pdo_sqlite, pdo_mysql, zip, zlib, pcntl, posix
          tools: composer:v2
          coverage: none

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm

      - name: Install PHP dependencies
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Pint (code style)
        run: composer pint:test

      - name: PHPStan (static analysis)
        run: composer phpstan

      - name: Prepare app (needed to generate Wayfinder routes)
        run: |
          cp .env.example .env
          php artisan key:generate --no-interaction
          php artisan wayfinder:generate --with-form

      - name: Install Node dependencies
        run: npm ci

      - name: Frontend format and lint
        run: npm run check

      - name: Frontend types
        run: npm run types:check

  tests:
    name: Tests
    runs-on: ubuntu-latest
    timeout-minutes: 30

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: dbnova
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -pdbnova"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20

    env:
      DBNOVA_DB_HOST: 127.0.0.1
      DBNOVA_DB_PORT: 3306
      # Integration tests create and drop only dbnova_test_* databases on this throwaway server.
      DBNOVA_TEST_DB_USERNAME: root
      DBNOVA_TEST_DB_PASSWORD: dbnova
      DBNOVA_MYSQL_BIN: /usr/bin/mysql
      DBNOVA_MYSQLDUMP_BIN: /usr/bin/mysqldump

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2
        with:
          php-version: '8.5'
          extensions: mbstring, pdo_sqlite, pdo_mysql, zip, zlib, pcntl, posix
          tools: composer:v2
          coverage: none

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm

      - name: MySQL client tools
        run: |
          if ! command -v mysqldump >/dev/null; then
            sudo apt-get update && sudo apt-get install -y mysql-client
          fi
          mysql --version
          mysqldump --version

      - name: Setup application
        run: composer setup

      - name: Run tests
        run: php artisan test --compact
